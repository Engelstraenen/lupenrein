<title>LUPENREIN Unterseite Abnahme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: eine Spalte, je Storyboard-Panel ein Band: Storyboard | Seite Laptop | Seite Handy. Bewusst nur dunkel (wie die Seite). */
:root{
  --bg:#07080d; --panel:#11131b; --line:#262a38; --fg:#f2f1ec; --mut:#a3a6b4; --acc:#a9bcff; --on-acc:#07080d;
  --f-d:"Cormorant Garamond",Georgia,serif; --f-b:Inter,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-b);margin:0}
.wrap{max-width:1500px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:40px}
h1,h2{font-family:var(--f-d);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(38px,5vw,68px);line-height:1}
h2{font-size:clamp(24px,2.4vw,34px);line-height:1.1}
.top{display:grid;gap:18px}
.status{display:flex;flex-wrap:wrap;gap:10px}
.pill{border:1px solid var(--line);background:var(--panel);padding:8px 12px;font-size:14px;font-weight:500;border-radius:999px}
.pill b{color:var(--acc);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;background:var(--acc);color:var(--on-acc);font-weight:600;text-decoration:none;letter-spacing:.04em;font-size:15px;border:0;border-radius:999px;cursor:pointer;font-family:var(--f-b)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
code.url{font-size:14px;color:var(--mut);word-break:break-all}
.ch{display:grid;gap:14px;padding-top:28px;border-top:1px solid var(--line)}
.ch-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ch-h .n{font-family:var(--f-d);font-size:clamp(30px,3vw,44px);color:var(--acc);line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr .3fr;gap:14px;align-items:start}
figure{margin:0;display:grid;gap:6px;min-width:0}
figure img{width:100%;height:auto;display:block;border:1px solid var(--line);cursor:zoom-in;background:#000}
figcaption{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.note{font-size:15px;color:var(--fg);background:var(--panel);border-left:3px solid var(--acc);padding:10px 14px;max-width:80ch;margin:0}
.note.ok{border-left-color:var(--line);color:var(--mut)}
pre{background:var(--panel);border:1px solid var(--line);padding:14px;overflow-x:auto;font-size:13.5px;margin:0;white-space:pre-wrap;word-break:break-all}
.box{display:grid;gap:12px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr}.grid figure:nth-child(3){grid-column:span 2;max-width:260px}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.grid figure:nth-child(3){grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
</style>
